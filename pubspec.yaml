name: reverie
description: Native interior design studio with shoppable room details.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.11.0 <4.0.0'
dependencies:
  flutter_localizations:
    sdk: flutter
  flutter:
    sdk: flutter
  supabase_flutter: 2.18.0
  image_picker: 1.2.4
  url_launcher: 6.3.3
  uuid: 4.6.0
  shared_preferences: 2.5.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: DMSerifDisplay
      fonts:
        - asset: assets/fonts/DMSerifDisplay-Regular.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
